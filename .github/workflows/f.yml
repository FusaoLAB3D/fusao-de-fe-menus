name: fetch
on:
  push:
    branches: [fetch]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          while read n u; do [ -z "$n" ] && continue; code=$(curl -sL -o out/$n.bin -w "%{http_code}" "$u"); echo "$n $code $(stat -c%s out/$n.bin)" >> out/log.txt; done < urls.txt
          cat out/log.txt
          git config user.name bot; git config user.email bot@x
          git add out; git commit -m "fetched [skip ci]"; git push
